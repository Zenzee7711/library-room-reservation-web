<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Booking History - Lecturer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&amp;display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet" />
  <style>
    body {
      font-family: 'Poppins', sans-serif;
    }

    .navbar {
      background-color: #CCA046;
      padding: 10px 20px;
    }

    .table-container {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      margin-bottom: 80px;
    }

    .table thead th {
      background-color: #437DD6;
      color: white;
    }

    .table tbody tr {
      height: 60px;
      vertical-align: middle;
    }

    .badge-status {
      padding: 5px 10px;
      border-radius: 10px;
      font-weight: bold;
      color: white;
    }

    .badge-approved {
      background-color: #16C098;
    }

    .badge-rejected {
      background-color: #DF0404;
    }

    .footer {
      background-color: #CCA046;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 5rem;
      font-family: 'Poppins', sans-serif;
      margin-top: 226px;
      font-size: 14px;
    }

    .footer-icons {
      display: flex;
      gap: 20px;

    }

    .footer-icons a {
      color: white;
      font-size: 24px;
      text-decoration: none;
    }

    .footer-info {
      text-align: center;
      flex: 1;
    }

    .footer-contact {
      text-align: left;
    }
  </style>
</head>

<body>
  <nav class="navbar navbar-expand-lg">
    <span class="navbar-brand text-white">Booking Room</span>
    <div class="ms-auto">
      <a class="btn btn-outline-light" href="/dashboard/lecturer">Home</a>
      <a class="btn btn-outline-light" href="/browseroomLecturer">Browse Room List</a>
      <a class="btn btn-outline-light" href="/browseroomLecturer/checkapprovals">Pending Approvals</a>
      <a class="btn btn-outline-light active text-black" href="/historyLecturer">History</a>
      <a class="btn btn-outline-light" id="btnLogout">Logout</a>
    </div>
  </nav>

  <div class="container mt-4">
    <h5>Welcome.... Ajarn <span id="username">Lecturer</span></h5>
    <div class="table-container mt-3">
      <h5><strong>Booking History</strong></h5>
      <table class="table primary table-striped mt-3">
        <thead>
          <tr>
            <th>Student Name</th>
            <th>Room Name</th>
            <th>Date</th>
            <th>Time</th>
            <th>Objective</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="historyTable"></tbody>
      </table>

      <div class="pagination-container text-end mt-3">
        <ul class="pagination justify-content-end" id="pagination"></ul>
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="footer-icons">
      <a href="https://www.facebook.com/MFULIBRARY"><i class="bi-facebook fs-2"></i></a>
      <a href="https://www.youtube.com/@mfulibrary1395"><i class="bi-youtube fs-2"></i></a>
      <a href="https://www.tiktok.com/@mfu.library"><i class="bi-tiktok fs-2"></i></a>
    </div>
    <div class="footer-info">
      <p><u>Opening Hours</u><br />Everyday: 8:00 - 20:00</p>
    </div>
    <div class="footer-contact">
      <p><u>Contact Us</u><br />tel: 0 5391 6339<br />email: ask.library@mfu.ac.th</p>
    </div>
  </div>

  <script>
    const username = sessionStorage.getItem("username") || "Lecturer";
    document.getElementById("username").textContent = username;

    const table = document.getElementById("historyTable");
    const pagination = document.getElementById("pagination");
    let allBookings = [];
    const bookingsPerPage = 10;
    let currentPage = 1;

    fetch('/api/lecturer/history')
      .then(res => res.json())
      .then(data => {
        allBookings = data;
        renderTable();
        renderPagination();
      });

      function renderTable() {
  table.innerHTML = "";
  const start = (currentPage - 1) * bookingsPerPage;
  const end = start + bookingsPerPage;
  const visible = allBookings.slice(start, end);

  visible.forEach(row => {
    const badgeClass = row.status === "Approved"
      ? "badge-approved"
      : "badge-rejected";

    const bookingDate = new Date(row.booking_date).toLocaleDateString();

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${row.student_name}</td>
      <td>${row.room_name}</td>
      <td>${bookingDate}</td>
      <td>${row.time}</td>
      <td>${row.objective}</td>
      <td><span class="badge-status ${badgeClass}">${row.status}</span></td>
    `;
    table.appendChild(tr);
  });
}


    function renderPagination() {
      pagination.innerHTML = '';
      const pageCount = Math.ceil(allBookings.length / bookingsPerPage);

      for (let i = 1; i <= pageCount; i++) {
        const li = document.createElement("li");
        li.className = `page-item ${i === currentPage ? 'active' : ''}`;
        li.innerHTML = `<a class="page-link" href="#">${i}</a>`;
        li.addEventListener("click", () => {
          currentPage = i;
          renderTable();
          renderPagination();
        });
        pagination.appendChild(li);
      }
    }

    document.getElementById('btnLogout').addEventListener('click', function () {
      Swal.fire({
        icon: 'warning',
        title: 'Are you sure?',
        text: 'You are about to log out of your account.',
        showCancelButton: true,
        confirmButtonText: 'Log out',
        cancelButtonText: 'Cancel',
        confirmButtonColor: '#3085d6',
        cancelButtonColor: '#d33'
      }).then((result) => {
        if (result.isConfirmed) {
          fetch('/logout', { method: 'POST' })
            .then(() => {
              sessionStorage.clear();
              window.location.href = '/login';
            })
            .catch(() => {
              Swal.fire("Error", "Logout failed", "error");
            });
        }
      });
    });
  </script>

</body>

</html>
