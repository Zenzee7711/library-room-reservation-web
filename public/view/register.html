<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Room - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet" />
    <style>
        body {
            background: url('/images/Room.jpg') no-repeat center center;
            background-size: cover;
            font-family: 'Poppins', sans-serif;
        }

        .navbar {
            background-color: #CCA046;
            padding: 10px 20px;
        }
        .login-container {
            max-width: 400px;
            height: 575px;
            margin: 30px auto;
            padding: 30px;
            background: rgba(255, 255, 255, 0.4);
            /* opacity 40% */
            border-radius: 20px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        /* make it less opacity */
        .login-container * {
            position: relative;
            z-index: 1;
        }

        /* make it less opacity */
        .login-container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 20px;
            z-index: 0;
        }

        .form-label {
            color: #000000;
        }

        .form-control {
            border: 1px solid #A67B5B;
            background-color: #ffffff;
        }

        .btn-custom {
            background-color: #437DD6;
            color: #ffffff;
            border-radius: 10px;
        }

        .btn-cancel {
            background-color: #C56363;
            color: #ffffff;
            border-radius: 10px;
        }

        /* make transition when pointing */
        .btn-custom:hover {
            background-color: #5A94E0;
        }

        .required::after {
            content: " *";
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <span class="navbar-brand text-white">Booking Room</span>
            <div>
                <a class="btn btn-outline-light" href="/login">Login</a>
                <a class="btn btn-outline-light active text-black" href="/register">Register</a>
            </div>
        </div>
    </nav>
    <div class="login-container">
        <form id="registerForm">
            <div class="mb-2">
                <label class="form-label required">Email</label>
                <input type="email" class="form-control" id="regEmail" required>
            </div>
            <div class="mb-2">
                <label class="form-label required">Password</label>
                <input type="password" class="form-control" id="regPassword" required>
            </div>
            <div class="mb-2">
                <label class="form-label required">Confirm Password</label>
                <input type="password" class="form-control" id="regConfirm" required>
            </div>
            <div class="mb-2 row">
                <div class="col-md-6">
                    <label class="form-label required">First Name</label>
                    <input type="text" class="form-control" id="regFirstName" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label required">Last Name</label>
                    <input type="text" class="form-control" id="regLastName" required>
                </div>
            </div>
            <div class="mb-2">
                <label class="form-label required">Phone Number</label>
                <input type="tel" class="form-control" id="regPhone">
            </div>
            <button type="submit" class="btn btn-custom w-100 mt-3">Register</button>
            <button type="button" class="btn btn-cancel w-100 mt-3" onclick="window.location.href='/login'">Cancel</button>
        </form>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener("submit", async function (event) {
            event.preventDefault();
    
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regConfirm').value;
            const firstName = document.getElementById('regFirstName').value;
            const lastName = document.getElementById('regLastName').value;
            const phone = document.getElementById('regPhone').value;
    
            if (password !== confirm) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Password Mismatch',
                    text: 'Please make sure passwords match.'
                });
                return;
            }
            const role = 'student';
    
            try {
                const response = await fetch('/register/create', {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password, firstName, lastName, phone, role })
                });
    
                const result = await response.json();
    
                if (response.ok) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Registration Successful',
                        showConfirmButton: false,
                        timer: 1500
                    }).then(() => {
                        window.location.href = "/login";
                    });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Registration Failed',
                        text: result.message || 'Something went wrong'
                    });
                }
            } catch (err) {
                console.error("Register error:", err);
                Swal.fire({
                    icon: 'error',
                    title: 'Server Error',
                    text: 'Please try again later.'
                });
            }
        });
    </script>
</body>

</html>
