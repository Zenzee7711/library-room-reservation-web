<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta content="ie=edge" http-equiv="X-UA-Compatible" />
    <title>Booking Room Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet" />
    <style>
        h1 {
            text-align: center;
        }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .navbar {
            background-color: #CCA046;
            padding: 10px 20px;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            border: 1px solid black;
            background-color: #F9E0A3;
            border-radius: 20px;
            padding: 30px;
        }

        .container-rooms {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 5px 40px;
            border: 5px solid #437DD6;
            border-radius: 50px;
            background-color: white;
            margin: 15px 0;
        }

        .bi {
            background-color: rgb(201, 189, 189);
            border-radius: 50px;
            font-size: 21px;
            color: black;
            padding-right: 5px;
            padding-left: 5px;
        }

        span {
            background-color: rgb(201, 189, 189);
            border-radius: 13px;
            font-size: 16px;
            color: black;
            padding: 3px 3px;
            width: 50px;
        }

        .footer {
            background-color: #CCA046;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 5rem;
            font-family: 'Poppins', sans-serif;
            margin-top: 226px;
            font-size: 14px;
        }

        .footer-icons {
            display: flex;
            gap: 20px;

        }

        .footer-icons a {
            color: white;
            font-size: 24px;
            text-decoration: none;
        }

        .footer-info {
            text-align: center;
            flex: 1;
        }

        .footer-contact {
            text-align: left;
        }
    </style>
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg">
        <p class="navbar-brand text-white">Booking Room</p>
        <div class="ms-auto">
            <a class="btn btn-outline-light active text black" href="/dashboard/staff">Home</a>
            <a class="btn btn-outline-light" href="/browseroomStaff"> Browse Room List</a>
            <a class="btn btn-outline-light" href="/browseroomStaff/edits">Edit Rooms</a>
            <a class="btn btn-outline-light" href="/historyStaff">History</a>
            <a class="btn btn-outline-light" id="btnLogout">Logout</a>
        </div>
    </nav>
    <h1 class="mt-3">Dashboard</h1>
    <div class="container">
        <div class="container-rooms">
            <i class="bi bi-person-fill"></i> Free Slots <span class="text-center" id="freeCount">0</span>
        </div>
        <div class="container-rooms">
            <i class="bi bi-person-fill-add"></i> Pending Slots <span class="text-center" id="pendingCount">0</span>
        </div>
        <div class="container-rooms">
            <i class="bi bi-person-fill-check"></i> Reserved Slots <span class="text-center" id="reservedCount">0</span>
        </div>
        <div class="container-rooms">
            <i class="bi bi-person-fill-slash"></i> Disabled Slots <span class="text-center" id="disabledCount">0</span>
        </div>
    </div>
    <div class="footer">
        <div class="footer-icons">
            <a href="https://www.facebook.com/MFULIBRARY"><i class="bi-facebook fs-2"></i></a>
            <a href="https://www.youtube.com/@mfulibrary1395"><i class="bi-youtube fs-2"></i></a>
            <a href="https://www.tiktok.com/@mfu.library"><i class="bi-tiktok fs-2"></i></a>
        </div>
        <div class="footer-info">
            <p><u>Opening Hours</u><br />Everyday: 8:00 - 20:00</p>
        </div>
        <div class="footer-contact">
            <p><u>Contact Us</u><br />tel: 0 5391 6339<br />email: ask.library@mfu.ac.th</p>
        </div>
    </div>
    <script>
         document.getElementById('btnLogout').addEventListener('click', function () {
      Swal.fire({
        icon: 'warning',
        title: 'Are you sure?',
        text: 'You are about to log out of your account.',
        showCancelButton: true,
        confirmButtonText: 'Log out',
        cancelButtonText: 'Cancel',
        confirmButtonColor: '#3085d6',
        cancelButtonColor: '#d33'
      }).then((result) => {
        if (result.isConfirmed) {
          fetch('/logout', { method: 'POST' })
            .then(() => {
              sessionStorage.clear();
              window.location.href = '/login';
            })
            .catch(() => {
              Swal.fire("Error", "Logout failed", "error");
            });
        }
      });
    });
        fetch('/api/dashboard/slots')
            .then(res => res.json())
            .then(data => {
                document.getElementById('freeCount').textContent = data.free;
                document.getElementById('pendingCount').textContent = data.pending;
                document.getElementById('reservedCount').textContent = data.reserved;
                document.getElementById('disabledCount').textContent = data.disabled;
            })
            .catch(err => {
                console.error("Dashboard load error:", err);
            });

    </script>
</body>

</html>
