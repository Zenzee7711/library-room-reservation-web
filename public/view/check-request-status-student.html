<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>My Bookings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet" />
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f4f4;
        }

        .navbar {
            background-color: #CCA046;
            padding: 10px 20px;
        }

        .card-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            justify-content: center;
            margin: 30px auto;
            padding: 0 15px;
            max-width: 1200px;
        }

        .booking-card {
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            background-color: #fff;
        }

        .booking-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .badge-status {
            font-size: 14px;
            padding: 5px 10px;
            border-radius: 8px;
        }

        .badge-waiting {
            background-color: yellow;
            color: #000;
        }

        .badge-approved {
            background-color: #00C7BE;
            color: #fff;
        }

        .badge-rejected {
            background-color: #ff4d4d;
            color: #fff;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg">
        <span class="navbar-brand text-white">Booking Room</span>
        <div class="ms-auto">
            <a class="btn btn-outline-light" href="/browseroomStudent">Home</a>
            <a class="btn btn-outline-light active" href="/browseroomStudent/bookings">My Bookings</a>
            <a class="btn btn-outline-light" href="/historyStudent">History</a>
            <a class="btn btn-outline-light" id="btnLogout">Logout</a>
        </div>
    </nav>

    <div class="d-flex flex-column align-items-center mt-5">
        <h5 class="mb-4">My Booking Request</h5>
        <div id="cardList" class="card-container"></div>
    </div>

    <script>
        fetch('/api/student/bookings')
            .then(res => res.json())
            .then(bookings => {
                const container = document.getElementById('cardList');
                container.innerHTML = '';

                bookings.forEach(b => {
                    const badgeClass =
                        b.booking_status === 'Waiting' ? 'badge-waiting' :
                            b.booking_status === 'Approved' ? 'badge-approved' :
                                'badge-rejected';

                    const card = document.createElement('div');
                    card.className = 'card booking-card';
                    card.innerHTML = `
                <img src="/images/${b.image}" alt="Room Image">
                <div class="card-body">
                    <h5 class="card-title"><strong>${b.room_name}</strong></h5>
                    <p class="card-text mb-1">📍 Location: ${b.location}</p>
                    <p class="card-text mb-1">👥 Capacity: ${b.capacity}</p>
                    <p class="card-text mb-1">📝 Objective: ${b.objective}</p>
                    <p class="card-text mb-1">📆 Date: ${new Date(b.booking_date).toLocaleDateString()}</p>
                    <p class="card-text mb-2">⏰ Time: ${b.start_time.slice(0, 5)} - ${b.end_time.slice(0, 5)}</p>
                    <span class="badge badge-status ${badgeClass}">${b.booking_status}</span>
                </div>
            `;
                    container.appendChild(card);
                });
            });

        document.getElementById('btnLogout').addEventListener('click', function () {
            Swal.fire({
                icon: 'warning',
                title: 'Are you sure?',
                text: 'You are about to log out of your account.',
                showCancelButton: true,
                confirmButtonText: 'Log out',
                cancelButtonText: 'Cancel',
                confirmButtonColor: '#3085d6',
                cancelButtonColor: '#d33'
            }).then((result) => {
                if (result.isConfirmed) {
                    fetch('/logout', {
                        method: 'POST'
                    }).then(() => {
                        sessionStorage.clear();
                        window.location.href = '/login';
                    }).catch(() => {
                        Swal.fire("Error", "Logout failed", "error");
                    });
                }
            });
        });

    </script>

</body>

</html>
