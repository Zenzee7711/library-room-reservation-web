<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Rooms availability</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet" />
    <style>
        .navbar {
            background-color: #CCA046;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
        }

        body {
            font-family: 'Poppins', sans-serif;
        }

        .table-container {
            margin: 50px auto;
            max-width: 90%;
        }

        th {
            background-color: #437DD6 !important;
            color: white !important;
            padding: 10px !important;
        }

        table td:first-child,
        table th:first-child {
            padding-left: 20px !important;
        }

        .btn-enable {
            background-color: #16C098;
            color: white;
        }

        .btn-disable {
            background-color: #E51313;
            color: white;
        }

        .btn-edit {
            background-color: #166bc0cf;
            color: white;
        }

        .btn-add {
            padding: 10px 20px;
            border-radius: 15px;
            background-color: #00C7BE;
            color: white;
        }

        .btn-enable,
        .btn-disable,
        .btn-edit {
            border-radius: 15px;
            width: 200px;
            margin-right: 20px;
        }

        .btn-enable:hover {
            background-color: #1cf1bf;
        }

        .btn-disable:hover {
            background-color: #ff0000;
        }

        .btn-edit:hover {
            background-color: #1d8effcf;
        }

        .btn-add:hover {
            background-color: #00e8dc;
        }

        td .btn-edit {
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        th,
        td {
            text-align: center;
            vertical-align: middle;
        }

        .btn-add {
            padding: 8px 18px;
            font-weight: 600;
            border-radius: 15px;
            background-color: #00C7BE;
            color: white;
            border: none;
        }

        .btn-add:hover {
            background-color: #00e8dc;
        }


        .card-style {
            background: white;
            border-radius: 15px;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.1);
            max-width: 100%;
        }

        .table th:first-child {
            border-top-left-radius: 15px;
        }

        .table th:last-child {
            border-top-right-radius: 15px;
        }

        x table td:nth-child(6),
        table td:nth-child(7) {
            width: 120px;
            padding: 10px;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg px-4">
        <span class="navbar-brand text-white">Booking Room</span>
        <div class="ms-auto">
            <a class="btn btn-outline-light" href="/dashboard/staff">Home</a>
            <a class="btn btn-outline-light" href="/browseroomStaff">Browse Room List</a>
            <a class="btn btn-outline-light active" href="/browseroomStaff/edits">Edit Rooms</a>
            <a class="btn btn-outline-light" href="/historyStaff">History</a>
            <a class="btn btn-outline-light" id="btnLogout">Logout</a>
        </div>
    </nav>

    <div class="table-container">
        <div class="card-style p-4" style="background-color: #fbfbfb;">
            <div class="d-flex">
                <a class="btn btn-add mb-3 ms-auto text-white" href="/browseroomStaff/add">+ Add new room</a>
            </div>
            <h5 class="mb-3">Rooms availability</h5>
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Room Name</th>
                        <th>Capacity</th>
                        <th>Location</th>
                        <th>Status</th>
                        <th></th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="roomTableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        const tableBody = document.getElementById("roomTableBody");

        fetch('/api/staff/rooms')
            .then(res => res.json())
            .then(rooms => {
                rooms.forEach(room => {
                    const row = document.createElement("tr");
                    row.innerHTML = `
                        <td>${room.room_name}</td>
                        <td>${room.capacity}</td>
                        <td>${room.location}</td>
                        <td>${room.status}</td>
                        <td><a href="/browseroomStaff/editroom?room_id=${room.room_id}" class="btn btn-edit">Edit</a></td>
                        <td><button class="btn ${room.status === 'Disable' ? 'btn-enable' : 'btn-disable'} 
                            toggle-btn" data-id="${room.room_id}" data-status="${room.status === 'Disable' ? 0 : 1}">
                            ${room.status === 'Disable' ? 'Enable' : 'Disable'}</button></td>

                    `;
                    tableBody.appendChild(row);
                });
            })
            .catch(err => {
                console.error("Error fetching rooms:", err);
            });
        setTimeout(() => {
            document.querySelectorAll('.toggle-btn').forEach(button => {
                button.addEventListener('click', () => {
                    const roomId = button.getAttribute('data-id');
                    const currentStatus = parseInt(button.getAttribute('data-status'));
                    const newStatus = currentStatus === 1 ? 0 : 1;


                    fetch('/api/staff/rooms/status', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                          room_id: roomId,
                             current_status: newStatus
                        })

                    })
                        .then(res => res.json())
                        .then(data => {
                            Swal.fire('Success', data.message, 'success').then(() => {
                                location.reload();
                            });
                        })
                        .catch(err => {
                            console.error('Toggle Error:', err);
                            Swal.fire('Error', 'Failed to update room status', 'error');
                        });
                });
            });
        }, 500);

        document.getElementById('btnLogout').addEventListener('click', function () {
      Swal.fire({
        icon: 'warning',
        title: 'Are you sure?',
        text: 'You are about to log out of your account.',
        showCancelButton: true,
        confirmButtonText: 'Log out',
        cancelButtonText: 'Cancel',
        confirmButtonColor: '#3085d6',
        cancelButtonColor: '#d33'
      }).then((result) => {
        if (result.isConfirmed) {
          fetch('/logout', { method: 'POST' })
            .then(() => {
              sessionStorage.clear();
              window.location.href = '/login';
            })
            .catch(() => {
              Swal.fire("Error", "Logout failed", "error");
            });
        }
      });
    });
    </script>


</body>

</html>
