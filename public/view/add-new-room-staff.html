<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Rooms availability</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet" />
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }

        .navbar {
            background-color: #CCA046;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
        }

        .container {
            margin-top: 30px;
            display: flex;
            justify-content: center;
        }

        .card {
            width: 450px;
            max-height: 700px;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.1);
            background-color: #F8F8F8;
        }

        .card img {
            display: block;
            margin-left: auto;
            margin-right: auto;
            max-height: 2500px;
            max-width: 350px;
            width: 100%;
            height: auto;
            border-radius: 10px;
        }

        .card img.no-image {
            background-color: #D3D3D3;
            width: 100%;
            height: 350px;
            border-radius: 10px;
        }

        .btn-custom {
            border-radius: 15px;
            padding: 10px 20px;
            margin: 10px 10px;
        }

        .btn-save {
            background-color: #16C098;
            color: white;
        }

        .btn-cancel {
            background-color: #E51313;
            color: white;
        }

        .btn-save:hover {
            background-color: #1cf1bf;
        }

        .btn-cancel:hover {
            background-color: #ff0000;
        }

        .form-label {
            font-weight: bold;
        }

        .form-control {
            border-radius: 15px;
        }

        .choose-image-btn {
            color: #007bff;
            text-decoration: underline;
            border: none;
            background: none;
            font-size: 20px;
        }

        .choose-image-btn:hover {
            cursor: pointer;
        }

        .form-group {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .form-group label {
            width: 150px;
            margin-right: 10px;
        }

        #description {
            height: 100px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <h5>Add New Room</h5>
            <img alt="Room Image" class="no-image" id="roomPreview" src="" />
            <form id="addRoomForm" enctype="multipart/form-data">
                <div class="form-group d-flex justify-content-center">
                    <label for="imageInput" class="choose-image-btn">Choose image</label>
                    <input type="file" id="imageInput" name="image" accept="image/*" style="display: none" />
                </div>
                <div class="form-group">
                    <label class="form-label" for="room">Room Name</label>
                    <input class="form-control" name="room_name" id="room" type="text" required />
                </div>
                <div class="form-group">
                    <label class="form-label" for="capacity">Capacity</label>
                    <input class="form-control" name="capacity" id="capacity" type="number" min="1" required />
                </div>
                <div class="form-group">
                    <label class="form-label" for="location">Location</label>
                    <input class="form-control" name="location" id="location" type="text" required />
                </div>
                <div class="form-group">
                    <label class="form-label" for="description">Description</label>
                    <input class="form-control" name="description" id="description" type="text" />
                </div>
                <div class="d-flex justify-content-center">
                    <button class="btn btn-save btn-custom w-25" type="submit">Add</button>
                    <button class="btn btn-cancel btn-custom w-25" type="button">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const imageInput = document.getElementById("imageInput");
        const preview = document.getElementById("roomPreview");

        imageInput.addEventListener("change", function () {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    preview.src = e.target.result;
                    preview.classList.remove("no-image");
                };
                reader.readAsDataURL(file);
            }
        });

        document.getElementById("addRoomForm").addEventListener("submit", async function (e) {
            e.preventDefault();

            const formData = new FormData(this);
            try {
                const response = await fetch("/api/staff/addroom", {
                    method: "POST",
                    body: formData
                });

                const result = await response.json();
                if (response.ok) {
                    Swal.fire({
                        icon: "success",
                        title: "Room added successfully!",
                        confirmButtonText: "OK"
                    }).then(() => window.location.href = "/browseroomStaff/edits");
                } else {
                    Swal.fire({ icon: "error", title: result.message || "Something went wrong." });
                }
            } catch (err) {
                console.error("Add room error:", err);
                Swal.fire({ icon: "error", title: "Server error", text: "Please try again later." });
            }
        });
        document.querySelector(".btn-cancel").addEventListener("click", () => history.back());

        document.getElementById('btnLogout').addEventListener('click', function () {
            Swal.fire({
                icon: 'warning',
                title: 'Are you sure?',
                text: 'You are about to log out of your account.',
                showCancelButton: true,
                confirmButtonText: 'Log out',
                cancelButtonText: 'Cancel',
                confirmButtonColor: '#3085d6',
                cancelButtonColor: '#d33'
            }).then((result) => {
                if (result.isConfirmed) {
                    fetch('/logout', { method: 'POST' })
                        .then(() => {
                            sessionStorage.clear();
                            window.location.href = '/login';
                        })
                        .catch(() => {
                            Swal.fire("Error", "Logout failed", "error");
                        });
                }
            });
        });
    </script>
</body>

</html>
