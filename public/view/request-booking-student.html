<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Room</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet" />
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }

        .navbar {
            background-color: #CCA046;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
        }

        .room-card {
            background-color: #F1D9A0;
            padding: 20px;
            border-radius: 20px 0 0 20px;
            box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .booking-card {
            background-color: #F8F8F8;
            padding: 20px;
            border-radius: 0 20px 20px 0;
            box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.1);
        }

        .room-details {
            font-weight: bold;
        }

        .room-image {
            border-radius: 10px;
            width: 95%;
            object-fit: cover;
            max-height: 350px;
        }

        .booking-form {
            background-color: #ffffff;
            border-radius: 10px;
            padding: 20px;
        }

        .room-booking-container {
            display: flex;
            justify-content: center;
        }

        .room-booking-container .room-card,
        .room-booking-container .booking-card {
            width: 50%;
        }

        .btn-confirm {
            background-color: #16C098;
            color: #ffffff;
            border-radius: 10px;
            box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.1);
            display: block;
            margin: 0 auto;
        }

        .btn-confirm:hover {
            background-color: #1cf1bf;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg px-4">
        <span class="navbar-brand text-white">Booking Room</span>
        <div class="ms-auto">
            <a href="/browseroomStudent" class="btn btn-outline-light">Home</a>
            <a class="btn btn-outline-light" href="/browseroomStudent/bookings">My Bookings</a>
            <a href="/historyStudent" class="btn btn-outline-light">History</a>
            <a class="btn btn-outline-light" id="btnLogout">Logout</a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="room-booking-container">
            <div class="room-card">
                <img src="" alt="Room Image" class="room-image mb-3" id="roomImage">
                <div class="room-details">
                    <h4 class="mb-3" id="roomName"><strong></strong></h4>
                    <p class="mb-1" id="roomLocation"></p>
                    <p class="mb-1" id="roomCapacity"></p>
                    <p class="mb-1" id="roomDescription"></p>
                </div>
            </div>

            <div class="booking-card">
                <h5 class="mb-3">Booking Information</h5>
                <form>
                    <div class="mb-3">
                        <label for="date" class="form-label">Date</label>
                        <input type="date" class="form-control" id="date" readonly>
                    </div>
                    <div class="mb-3">
                        <label for="time" class="form-label">Time</label>
                        <select class="form-select" id="time" disabled>
                            <option selected disabled>Loading...</option>
                        </select>
                    </div>
                    <div class="mb-5">
                        <label for="objective" class="form-label">Objective</label>
                        <input type="text" class="form-control" id="objective" placeholder="Enter objective" required>
                    </div>
                    <button type="submit" class="btn btn-confirm w-10">Confirm Booking</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const url = new URLSearchParams(window.location.search);
            const room_id = url.get("room_id");
            const time = url.get("time");

            if (!room_id || !time) {
                Swal.fire("Error", "Missing room ID or time in URL", "error");
                return;
            }

            fetch('/api/currentdate')
                .then(res => res.json())
                .then(data => {
                    document.getElementById("date").value = data.today;
                });

            document.getElementById("time").innerHTML = `<option selected>${time}</option>`;

            fetch(`/api/student/room/${room_id}`)
                .then(res => res.json())
                .then(room => {
                    document.getElementById("roomImage").src = `/images/${room.image}`;
                    document.getElementById("roomName").innerHTML = `<strong>${room.room_name}</strong>`;
                    document.getElementById("roomLocation").textContent = `Location : ${room.location}`;
                    document.getElementById("roomCapacity").textContent = `Capacity : ${room.capacity}`;
                    document.getElementById("roomDescription").textContent = `Description : ${room.description}`;
                })
                .catch(err => {
                    console.error(err);
                    Swal.fire("Error", "Room info not found", "error");
                });

            document.querySelector("form").addEventListener("submit", function (e) {
                e.preventDefault();
                // The server files the booking against the signed-in session,
                // so no user id is sent from the browser.
                const booking = {
                    room_id,
                    time,
                    booking_date: document.getElementById("date").value,
                    objective: document.getElementById("objective").value
                };

                fetch("/api/student/book", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(booking)
                })
                    .then(res => res.json().then(data => {
                        if (!res.ok) {

                            Swal.fire("Error", data.message, "error");
                        } else {

                            Swal.fire("Success", data.message, "success").then(() => {
                                window.location.href = "/browseroomStudent/bookings";
                            });
                        }
                    }))
                    .catch(err => {
                        console.error(err);
                        Swal.fire("Error", "Something went wrong", "error");
                    });

            });
        });

        document.getElementById('btnLogout').addEventListener('click', function () {
            Swal.fire({
                icon: 'warning',
                title: 'Are you sure?',
                text: 'You are about to log out of your account.',
                showCancelButton: true,
                confirmButtonText: 'Log out',
                cancelButtonText: 'Cancel',
                confirmButtonColor: '#3085d6',
                cancelButtonColor: '#d33'
            }).then((result) => {
                if (result.isConfirmed) {
                    fetch('/logout', { method: 'POST' })
                        .then(() => {
                            sessionStorage.clear();
                            window.location.href = '/login';
                        })
                        .catch(() => {
                            Swal.fire("Error", "Logout failed", "error");
                        });
                }
            });
        });
    </script>
</body>

</html>
