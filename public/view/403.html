<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Room - Access Denied</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&amp;display=swap" rel="stylesheet" />
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            background: url('/images/Room.jpg') no-repeat center center;
            background-size: cover;
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .message-card {
            max-width: 420px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .code {
            font-size: 64px;
            font-weight: 600;
            color: #CCA046;
            line-height: 1;
        }

        .btn-custom {
            background-color: #CCA046;
            color: #fff;
        }

        .btn-custom:hover {
            background-color: #b88c38;
            color: #fff;
        }
    </style>
</head>

<body>
    <div class="message-card">
        <p class="code">403</p>
        <h1 class="h4 mt-3">Access denied</h1>
        <p class="text-muted">Your account does not have permission to open this page.</p>
        <a href="/login" class="btn btn-custom mt-2">Back to login</a>
    </div>
</body>

</html>
