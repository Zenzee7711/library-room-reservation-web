<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Edit Room</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet" />
    <style>
        .navbar {
            background-color: #CCA046;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
        }

        body {
            font-family: 'Poppins', sans-serif;
        }

        .container {
            margin-top: 30px;
            display: flex;
            justify-content: center;
        }

        .card {
            width: 500px;
            max-height: 850px;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.1);
            background-color: #F8F8F8;
        }

        .card img {
            display: block;
            margin-left: auto;
            margin-right: auto;
            max-height: 250px;
            max-width: 350px;
            width: 100%;
            height: auto;
            border-radius: 10px;
        }

        .btn-custom {
            border-radius: 15px;
            padding: 10px 20px;
            margin: 10px 10px;
        }

        .btn-save {
            background-color: #16C098;
            color: white;
        }

        .btn-cancel {
            background-color: #E51313;
            color: white;
        }

        .btn-save:hover {
            background-color: #1cf1bf;
        }

        .btn-cancel:hover {
            background-color: #ff0000;
        }

        .form-label {
            font-weight: bold;
        }

        .form-control {
            border-radius: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg px-4">
        <span class="navbar-brand text-white">Booking Room</span>
        <div class="ms-auto">
            <a class="btn btn-outline-light" href="/dashboard/staff">Home</a>
            <a class="btn btn-outline-light" href="/browseroomStaff">Browse Room List</a>
            <a class="btn btn-outline-light active" href="/browseroomStaff/edits">Edit Rooms</a>
            <a class="btn btn-outline-light" href="/historyStaff">History</a>
            <a class="btn btn-outline-light" id="btnLogout">Logout</a>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <h5 class="text-center">Edit Room</h5>
            <img id="previewImage" alt="Room Image" src="" />
            <div class="form-group mt-2">
                <label class="form-label">Change Image</label>
                <input class="form-control" type="file" id="imageInput" accept="image/*" />
            </div>
            <form>
                <div class="form-group">
                    <label class="form-label" for="room">Room Name</label>
                    <input class="form-control" id="room" type="text" />
                </div>
                <div class="form-group">
                    <label class="form-label" for="capacity">Capacity</label>
                    <input class="form-control" id="capacity" type="number" />
                </div>
                <div class="form-group">
                    <label class="form-label" for="location">Location</label>
                    <input class="form-control" id="location" type="text" disabled />
                </div>
                <div class="form-group">
                    <label class="form-label" for="description">Description</label>
                    <textarea class="form-control" id="description" rows="2"></textarea>
                </div>
                <div class="d-flex justify-content-center">
                    <button class="btn btn-save btn-custom w-25" type="submit">Save</button>
                    <button class="btn btn-cancel btn-custom w-25" type="button">Cancel</button>
                </div>
            </form>
        </div>
    </div>


    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const roomId = new URLSearchParams(window.location.search).get("room_id");

            const roomInput = document.getElementById("room");
            const capacityInput = document.getElementById("capacity");
            const locationInput = document.getElementById("location");
            const descriptionInput = document.getElementById("description");
            const previewImage = document.getElementById("previewImage");
            const imageInput = document.getElementById("imageInput");

            fetch(`/api/staff/rooms/${roomId}`)
                .then(res => res.json())
                .then(data => {
                    roomInput.value = data.room_name;
                    capacityInput.value = data.capacity;
                    locationInput.value = data.location;
                    descriptionInput.value = data.description || '';
                    previewImage.src = `/images/${data.image || 'Room.jpg'}`;
                })
                .catch(err => {
                    console.error(err);
                    Swal.fire("Error", "Could not load room info", "error");
                });


            imageInput.addEventListener("change", function () {
                const file = imageInput.files[0];
                if (file) {
                    previewImage.src = URL.createObjectURL(file);


                    const formData = new FormData();
                    formData.append("image", file);

                    fetch(`/api/staff/rooms/${roomId}/image`, {
                        method: "PUT",
                        body: formData
                    })
                        .then(res => res.json())
                        .then(data => {
                            Swal.fire("Image Updated", data.message, "success");
                        })
                        .catch(err => {
                            console.error(err);
                            Swal.fire("Error", "Failed to update image", "error");
                        });
                }
            });


            document.querySelector("form").addEventListener("submit", function (e) {
                e.preventDefault();

                fetch(`/api/staff/rooms/${roomId}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        room_name: roomInput.value,
                        capacity: capacityInput.value,
                        description: descriptionInput.value
                    })
                })
                    .then(res => res.json())
                    .then(data => {
                        Swal.fire("Success", data.message, "success").then(() => {
                            window.location.href = "/browseroomStaff/edits";
                        });
                    })
                    .catch(err => {
                        console.error(err);
                        Swal.fire("Error", "Could not update room", "error");
                    });
            });

            document.querySelector(".btn-cancel").addEventListener("click", function () {
                history.back();
            });

            document.getElementById('btnLogout').addEventListener('click', function () {
                Swal.fire({
                    icon: 'warning',
                    title: 'Are you sure?',
                    text: 'You are about to log out of your account.',
                    showCancelButton: true,
                    confirmButtonText: 'Log out',
                    cancelButtonText: 'Cancel',
                    confirmButtonColor: '#3085d6',
                    cancelButtonColor: '#d33'
                }).then((result) => {
                    if (result.isConfirmed) {
                        fetch('/logout', { method: 'POST' })
                            .then(() => {
                                sessionStorage.clear();
                                window.location.href = '/login';
                            })
                            .catch(() => {
                                Swal.fire("Error", "Logout failed", "error");
                            });
                    }
                });
            });
        });
    </script>
</body>

</html>
