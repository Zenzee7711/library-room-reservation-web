<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Booking Requests</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet" />
  <style>
    body {
      font-family: 'Poppins', sans-serif;
    }

    .navbar {
      background-color: #CCA046;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
    }

    .table-container {
      margin: 50px auto;
      max-width: 95%;
    }

    th {
      background-color: #437DD6 !important;
      color: white !important;
      padding: 10px !important;
    }

    table td:first-child,
    table th:first-child {
      padding-left: 20px !important;
    }

    .btn-approve {
      background-color: #16C098;
      color: white;
    }

    .btn-reject {
      background-color: #E51313;
      color: white;
    }

    .btn-approve,
    .btn-reject {
      border-radius: 15px;
      width: 120px;
      font-size: 16px;
      padding: 8px 12px;
    }

    .btn-approve:hover {
      background-color: #1cf1bf;
    }

    .btn-reject:hover {
      background-color: #ff0000;
    }

    .pagination-container {
      display: flex;
      justify-content: end;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <nav class="navbar navbar-expand-lg px-4">
    <span class="navbar-brand text-white">Booking Room</span>
    <div class="ms-auto">
      <a class="btn btn-outline-light" href="/dashboard/lecturer">Home</a>
      <a class="btn btn-outline-light" href="/browseroomLecturer">Browse Room List</a>
      <a class="btn btn-outline-light active" href="/browseroomLecturer/checkapprovals">Pending Approvals</a>
      <a class="btn btn-outline-light" href="/historyLecturer">History</a>
      <a class="btn btn-outline-light" id="btnLogout">Logout</a>
    </div>
  </nav>

  <div class="table-container">
    <h5>Booking Requests</h5>
    <table class="table table-striped">
      <thead>
        <tr>
          <th>Student Name</th>
          <th>Room</th>
          <th>Date</th>
          <th>Time</th>
          <th>Objective</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="approvalTableBody"></tbody>
    </table>
    <div class="pagination-container">
      <ul class="pagination" id="pagination"></ul>
    </div>
  </div>

  <script>
    const container = document.getElementById("approvalTableBody");
    const pagination = document.getElementById("pagination");
    const rowsPerPage = 10;
    let allRequests = [];
    let currentPage = 1;

    fetch('/api/lecturer/approvals')
      .then(res => res.json())
      .then(data => {
        allRequests = data;
        renderTable();
        renderPagination();
      });

    function renderTable() {
      container.innerHTML = "";
      const start = (currentPage - 1) * rowsPerPage;
      const end = start + rowsPerPage;
      const visible = allRequests.slice(start, end);

      if (visible.length === 0) {
        container.innerHTML = `<tr><td colspan="6" class="text-center">No pending requests</td></tr>`;
        return;
      }

      visible.forEach(req => {
        const time = `${req.start_time.slice(0, 5)} - ${req.end_time.slice(0, 5)}`;
        const date = new Date(req.booking_date).toLocaleDateString();

        const tr = document.createElement("tr");
        tr.innerHTML = `
  <td>${req.student_name}</td>
  <td>${req.room_name}<br><small>${req.location}</small></td>
  <td>${date}</td>
  <td>${time}</td>
  <td>${req.objective}</td>
  <td>
    <button class="btn btn-approve me-2" onclick="handleAction(${req.booking_id}, 'Approved')">Approve</button>
    <button class="btn btn-reject" onclick="handleAction(${req.booking_id}, 'Rejected')">Reject</button>
  </td>
`;

        container.appendChild(tr);
      });
    }

    function renderPagination() {
      pagination.innerHTML = "";
      const pageCount = Math.ceil(allRequests.length / rowsPerPage);

      for (let i = 1; i <= pageCount; i++) {
        const li = document.createElement("li");
        li.className = `page-item ${i === currentPage ? "active" : ""}`;
        li.innerHTML = `<a class="page-link" href="#">${i}</a>`;
        li.addEventListener("click", () => {
          currentPage = i;
          renderTable();
          renderPagination();
        });
        pagination.appendChild(li);
      }
    }

    function handleAction(booking_id, action) {
      // The approver is taken from the session server-side.
      fetch('/api/lecturer/approval-action', {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ booking_id, action })
      })
        .then(res => res.json().then(data => ({ ok: res.ok, data })))
        .then(({ ok, data }) => {
          if (!ok) {
            Swal.fire("Error", data.message || "Could not update this request", "error");
            return;
          }
          Swal.fire("Success", data.message, "success").then(() => location.reload());
        })
        .catch(err => {
          console.error(err);
          Swal.fire("Error", "Failed to update booking", "error");
        });
    }


    document.getElementById('btnLogout').addEventListener('click', function () {
      Swal.fire({
        icon: 'warning',
        title: 'Are you sure?',
        text: 'You are about to log out of your account.',
        showCancelButton: true,
        confirmButtonText: 'Log out',
        cancelButtonText: 'Cancel',
        confirmButtonColor: '#3085d6',
        cancelButtonColor: '#d33'
      }).then((result) => {
        if (result.isConfirmed) {
          fetch('/logout', { method: 'POST' })
            .then(() => {
              sessionStorage.clear();
              window.location.href = '/login';
            })
            .catch(() => {
              Swal.fire("Error", "Logout failed", "error");
            });
        }
      });
    });
  </script>
</body>

</html>
