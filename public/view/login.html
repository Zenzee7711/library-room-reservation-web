<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Room - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet" />
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            background: url('/images/Room.jpg') no-repeat center center;
            background-size: cover;
            font-family: 'Poppins', sans-serif;
        }

        .navbar {
            background-color: #CCA046;
            padding: 10px 20px;
        }

        .login-container {
            max-width: 375px;
            height: 450px;
            margin: 50px auto;
            padding: 30px;
            background: rgba(255, 255, 255, 0.4);
            /* opacity 40% */
            border-radius: 20px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        /* make it less opacity */
        .login-container * {
            position: relative;
            z-index: 1;
        }

        /* make it less opacity */
        .login-container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 20px;
            z-index: 0;
        }

        .form-label {
            color: #000000;
        }

        .form-control {
            border: 1px solid #A67B5B;
            background-color: #ffffff;
        }

        .btn-custom {
            background-color: #437DD6;
            color: #ffffff;
            border-radius: 10px;
        }

        /* make transition when pointing */
        .btn-custom:hover {
            background-color: #5A94E0;
        }

        .logo {
            width: 120px;
            height: auto;

        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <span class="navbar-brand text-white">Booking Room</span>
            <div>
                <a class="btn btn-outline-light active text-black" href="/login">Login</a>
                <a class="btn btn-outline-light" href="/register">Register</a>
            </div>
        </div>
    </nav>
    <div class="login-container">
        <img src="/images/logo.png" alt="University Logo" class="logo mb-3 d-block mx-auto">
        <form id="loginForm">
            <div class="mb-2">
                <label class="form-label">Email</label>
                <input type="email" id="loginEmail" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" id="loginPassword" class="form-control">
            </div>
            <button type="submit" class="btn btn-custom w-100 mt-3">Login</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener("submit", async function (event) {
            event.preventDefault();
            const username = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const response = await fetch('/login', {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });

                const result = await response.json();

                if (response.ok) {
                    sessionStorage.setItem("user_id", result.user_id);
                    sessionStorage.setItem('username', result.username);
                    Swal.fire({
                        icon: 'success',
                        title: 'Login Successful',
                        showConfirmButton: false,
                        timer: 1500
                    }).then(() => {
                        window.location.href = result.dashboardUrl;
                    });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Login Failed',
                        text: result.message || 'Invalid credentials',
                    });
                }
            } catch (error) {
                console.error("Error", error);
                Swal.fire({
                    icon: 'error',
                    title: 'Server Error',
                    text: 'Something went wrong. Try again later.',
                });
            }
        });
    </script>

</body>

</html>
